# Phase 9 analyzer blocks for governance.yaml.
# Schema v1 treats these blocks as optional. Required-presence by risk
# tier is enforced by validation/CONSISTENCY_RULES.md sections 17-19.

analyzers:
  mutation:
    tool: cosmic-ray
    commandTemplate: "cd astaire && uv run --with cosmic-ray cosmic-ray exec cosmic-ray.toml ../artifacts/cosmic-ray/session.sqlite"
    reportPath: docs/evidence/mutation/
    threshold:
      medium: 0.70
      high: 0.85
      critical: 0.90
  domainGlossary:
    path: docs/glossary/
    coverageRule:
      protectedPaths:
        - src/domain/
  architectureFitness:
    rulesPath: validation/architecture-fitness.yaml
    engine: scripts/validators/architecture_fitness.py
