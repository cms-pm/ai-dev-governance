apiVersion: ai-dev-governance/v1
governanceVersion: v1.2.0
profile: strict-baseline
adapters:
  - providers/claude
  - tooling/rtk
evidence:
  planningPath: docs/planning
  validationPath: docs/validation
  releasePath: docs/releases
exceptions:
  registryPath: docs/governance/exceptions.yaml
  reviewCadenceDays: 14
approval:
  accountableRole: tech-lead
  requiredReviewers: 2
automation:
  mode: risk-tiered
  stateMachine:
    - ingest
    - plan
    - artifact-generation
    - implementation
    - validation
    - board-review
    - gate
    - release
  tiers:
    low:
      autoMerge: true
      requiredHumanApprovals: 0
      boardReviewRequired: false
    medium:
      autoMerge: false
      requiredHumanApprovals: 1
      boardReviewRequired: false
    high:
      autoMerge: false
      requiredHumanApprovals: 2
      boardReviewRequired: true
    critical:
      autoMerge: false
      requiredHumanApprovals: 2
      boardReviewRequired: true
  boardTriggerRules:
    highRequiresBoard: true
    criticalRequiresBoard: true
  humanInterventionRules:
    chairApprovalForHighCritical: true
    exceptionApprovalRequired: true
    compositionApprovalRequired: true
boardReview:
  enabled: true
  packetTemplatePath: templates/BOARD_REVIEW_PACKET_TEMPLATE.md
  meetingTemplatePath: templates/BOARD_REVIEW_MEETING_TEMPLATE.md
  opportunityTemplatePath: templates/BOARD_OPPORTUNITY_REGISTER_TEMPLATE.md
  sprintCritiqueCadenceDays: 7
  accountabilityCadenceDays: 28
  incidentReviewSlaHours: 24
  criticalFindingsBlockRelease: true
  selection:
    requiredLenses:
      - architecture
      - reliability
      - security
      - performance
      - operability
      - cognitive-load
      - agentic-AI-systems
    minimumWeightedScore: 4.0
    minimumRoleFitScore: 4.0
    minimumEvidenceAccessibilityScore: 4.0
    refreshCadence: quarterly
    incidentTriggeredRefresh: true
  composition:
    rosterPath: docs/planning/board/board-composition-approval-2026-04-19.md
    approvalRecordPath: docs/planning/board/board-composition-approval-2026-04-19.md
    minimumAlternatesPerSeat: 1
analyzers:
  mutation:
    tool: cosmic-ray
    commandTemplate: "cd astaire && uv run --with cosmic-ray cosmic-ray exec cosmic-ray.toml ../artifacts/cosmic-ray/astaire-claims-projection.sqlite"
    reportPath: docs/evidence/mutation/
    threshold:
      medium: 0.70
      high: 0.85
      critical: 0.90
  domainGlossary:
    path: docs/glossary/
    coverageRule:
      protectedPaths:
        - astaire/src/domain/
  architectureFitness:
    rulesPath: validation/architecture-fitness.yaml
    engine: scripts/validators/architecture_fitness.py
# acceptanceIntegrity: preventive-core gate contract (ADG v1.2.0). Blocks
# proxy-substitution, spec-mutation, self-grading, and frozen-boundary
# evasion. See core/ACCEPTANCE_INTEGRITY.md for mechanics; no metrics/
# feedback-loop block is declared here (out of scope for v1.2.0).
acceptanceIntegrity:
  # NOTE: the numeric values below are illustrative defaults, not values
  # derived from a measured baseline. No ADG-side gate consumes them yet
  # (enforcement lands as a ForgeVM-side prototype, per ADG v1.2.0 §7
  # placement decision). Consumers adopting acceptanceIntegrity enforcement
  # MUST tune these to their own project's evidence characteristics before
  # treating them as a live gate threshold.
  nonTriviality:
    # Minimum evidence size / assertion count below which a hard
    # requirement's evidence is presumed a stub and FAILs closed.
    minEvidenceBytes: 256
    minAssertionsPerHardRequirement: 1
  intentCoverage:
    # Minimum percentage of hard requirements that must carry an
    # antiProxy / intent assertion (core/PLANNING_METHODOLOGY.md
    # hard:true predicates), tiered like analyzers.mutation.threshold.
    minAntiProxyCoveragePercent:
      medium: 50
      high: 80
      critical: 100
  gateStateMachine:
    states: [PASS, WAIVED, FAIL]
    terminalStates: [PASS, WAIVED, FAIL]
    # Any hard requirement lacking a qualified (@<evidence_mode>) verdict,
    # a passing intent assertion, or a waiver record resolves to FAIL.
    onUnresolvedRequirement: FAIL
    onSelfGradedVerdict: FAIL
  frozenPaths:
    # Manifest of paths owned by closed chunks. A diff touching a
    # declared path with no matching waiver is a gate FAIL (M4).
    manifestPath: docs/governance/frozen-paths.yaml
    enforcement: fail-closed
updateCadence: monthly
compatibility: strict
