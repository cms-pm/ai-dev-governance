apiVersion: ai-dev-governance/v1
governanceVersion: v0.7.4
profile: strict-baseline+embedded
adapters:
  - providers/codex
  - tooling/rtk
  - profiles/embedded
analyzerDeclaration:
  structured:
    analyzer: example-static-analyzer
    version: 1.0.0
    capabilitiesDetected:
      recursion: true
      unboundedLoops: true
      dynamicAllocationPostInit: true
      uncheckedReturnValues: true
    selfAttestedBy: tech-lead
    attestationDate: 2026-05-19
evidence:
  planningPath: docs/planning
  validationPath: docs/validation
  releasePath: docs/releases
  embeddedVerificationChecklistPath: embedded-verification-checklist.example.md
exceptions:
  registryPath: docs/governance/exceptions.yaml
  reviewCadenceDays: 14
approval:
  accountableRole: tech-lead
  requiredReviewers: 2
automation:
  mode: risk-tiered
  stateMachine:
    - ingest
    - plan
    - artifact-generation
    - implementation
    - validation
    - board-review
    - gate
    - release
  tiers:
    low:
      autoMerge: true
      requiredHumanApprovals: 0
      boardReviewRequired: false
    medium:
      autoMerge: false
      requiredHumanApprovals: 1
      boardReviewRequired: false
    high:
      autoMerge: false
      requiredHumanApprovals: 2
      boardReviewRequired: true
    critical:
      autoMerge: false
      requiredHumanApprovals: 2
      boardReviewRequired: true
  boardTriggerRules:
    highRequiresBoard: true
    criticalRequiresBoard: true
  humanInterventionRules:
    chairApprovalForHighCritical: true
    exceptionApprovalRequired: true
    compositionApprovalRequired: true
boardReview:
  enabled: true
  packetTemplatePath: .governance/ai-dev-governance/templates/BOARD_REVIEW_PACKET_TEMPLATE.md
  meetingTemplatePath: .governance/ai-dev-governance/templates/BOARD_REVIEW_MEETING_TEMPLATE.md
  opportunityTemplatePath: .governance/ai-dev-governance/templates/BOARD_OPPORTUNITY_REGISTER_TEMPLATE.md
  sprintCritiqueCadenceDays: 7
  accountabilityCadenceDays: 28
  incidentReviewSlaHours: 24
  criticalFindingsBlockRelease: true
  selection:
    requiredLenses:
      - architecture
      - reliability
      - security
      - performance
      - operability
      - cognitive-load
      - domain-specific
    minimumWeightedScore: 4.0
    minimumRoleFitScore: 4.0
    minimumEvidenceAccessibilityScore: 4.0
    refreshCadence: quarterly
    incidentTriggeredRefresh: true
  composition:
    rosterPath: docs/governance/board/board-composition.yaml
    approvalRecordPath: docs/governance/board/board-composition-approval.md
    minimumAlternatesPerSeat: 1
updateCadence: monthly
compatibility: strict
# Analyzers block (v0.7.5+, Phase 9 SCN-9.2). All three sub-blocks are
# OPTIONAL at the schema level (Q5 resolution). Tier-gated required-
# presence is enforced at validation/CONSISTENCY_RULES.md §17–§19.
# Thresholds under analyzers.mutation were ratified by DEC-0005.
# validation/CONSISTENCY_RULES.md §17 enforces required-presence for
# strict-baseline manifests outside the schema layer.
analyzers:
  mutation:
    tool: cosmic-ray
    commandTemplate: "cosmic-ray exec {config} {session} && cosmic-ray dump {session} > {report}"
    reportPath: docs/evidence/mutation/
    threshold:
      medium: 70
      high: 85
      critical: 90
  domainGlossary:
    path: docs/glossary/
    coverageRule:
      protectedPaths:
        - src/domain/
  architectureFitness:
    rulesPath: validation/architecture-fitness.yaml
    engine: scripts/validators/architecture_fitness.py
# Graphify block (v0.6.0+). Drives scripts/run_graphify.sh.
# NOTE: `allowlist` grammar is fnmatch-style (`*`, `**`, `?`). Brace
# alternations like `**/*.{c,h}` are NOT expanded and will be rejected by
# the validator. Write out each extension explicitly.
graphify:
  collectionStrategy: split
  securityMode: restricted
  sourceRepoTag: example-product
  allowlist:
    - "src/**/*.py"
    - "src/**/*.md"
    - "lib/**/*.c"
    - "lib/**/*.cc"
    - "lib/**/*.cpp"
    - "lib/**/*.h"
    - "lib/**/*.hpp"
    - "docs/**/*.md"
