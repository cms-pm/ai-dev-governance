# Smoke test Codex should run before opening any PR.
preflight_per_chunk:
  - ".astaire/astaire startup --root ."
  - "git status   # clean working tree on branch SCN-8.3.<n>"
  - "<chunk-specific verification_commands above>"
  - "git add <changed files explicitly; do NOT use git add -A>"
  - "git diff --cached   # last-look review"
  - "git commit -m 'SCN-8.3.<n>: <summary>'"
  - ".astaire/astaire scan --root .  # picks up post-commit hook drift if any"
  - ".astaire/astaire lint   # 0/0"

