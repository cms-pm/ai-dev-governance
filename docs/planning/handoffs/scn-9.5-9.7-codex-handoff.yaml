# Bootstrap — every Codex session MUST do this first.
bootstrap:
  - cmd: ".astaire/astaire startup --root ."
    purpose: "init → scan → sync → status; populates L0 cache"
  - cmd: ".astaire/astaire context --tag phase=9 --budget 6000"
    purpose: "load chunk plan, risks, TO-DO, pool questions for Phase 9"
  - cmd: ".astaire/astaire query -t chunk-plan --tag phase=9"
    purpose: "confirm SCN-9.5/9.6/9.7 acceptance criteria from authoritative_plan"

# Global rules. Fail-closed; identical discipline to SCN-8.3.* handoff.
governance:
  branch_model: "one SCN per branch named SCN-9.<n>, single atomic commit"
  commit_message_pattern: "SCN-9.<n>: <imperative summary>"
  artifact_read_policy: "All docs/planning/** and docs/releases/** reads go through .astaire/astaire query|context. Direct Read/Grep only for files Astaire has no projection of, or in immediate service of an Edit/Write."
  post_edit_required:
    - ".astaire/astaire scan --root ."
    - ".astaire/astaire lint   # must be 0 warnings / 0 errors"
  validator_required: "scripts/validate_governance.sh exit 0 at every intermediate commit."
  rtk_required: "Bash-visible high-volume commands run as-is so the Claude Code hook compresses them. Don't bypass with built-in tools for broad sweeps."
  do_not_modify_landed_artifacts:
    - docs/planning/chunks/phase-9-chunks.md
    - docs/planning/pool_questions/phase-9-tdr-hardening.md
    - docs/planning/phase-9-risks.md
    - core/MODULARITY_GOVERNANCE.md                  # SCN-9.1 normative
    - core/DOMAIN_LANGUAGE_GOVERNANCE.md             # SCN-9.1 normative
    - core/MUTATION_EVIDENCE.md                      # SCN-9.1 advisory-marked; flip lives in SCN-9.7 only
    - contracts/governance-manifest.schema.json      # SCN-9.2 frozen at v1; new blocks stay OPTIONAL
    - validation/CONSISTENCY_RULES.md §17,§18,§19    # SCN-9.2 wording is final
    - scripts/validators/{mutation_threshold,glossary_coverage,architecture_fitness}.py  # SCN-9.2 frozen
    - validation/architecture-fitness.yaml           # SCN-9.4 ruleset
    - astaire/src/domain/claims/                     # SCN-9.4 hexagonal pilot; further refactor is Phase 10
    - adapters/providers/claude/skills/              # SCN-9.3 frozen
  no_unilateral_threshold_flip: >
    core/MUTATION_EVIDENCE.md stays advisory and §17 stays WARN until SCN-9.7
    board adoption (DEC-0005). SCN-9.5 only proposes thresholds; it does NOT
    flip them. SCN-9.6 does not flip them either.
  out_of_scope:
    - Full-repo hexagonal refactor of astaire/ ingest/FTS/CLI (Phase 10)
    - Codex adapter parity for the nine Claude skills (Phase 10)
    - R-8.2-05 closure (Phase 8.1 reciprocal entry pending)
    - Wider language style coverage (Rust/Go) — Phase 10+
    - Any change to core/MUTATION_EVIDENCE.md tier table before SCN-9.7 sign-off

sequencing:
